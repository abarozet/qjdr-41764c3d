# Publishes the web version (QuestionnaireJDR/) to GitHub Pages.
# Repository settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The site is exactly the QuestionnaireJDR/ folder as committed: the job only
# CHECKS that the generated files are up to date (desktop HTML copy, sw.js
# precache list and version) and runs the unit tests; it never rewrites files,
# so the deployed precache version is the committed one (no spurious
# "Nouvelle version disponible" after a deployment that changed nothing).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Generated files are up to date (index.html copy, sw.js precache + version)"
        run: node dev/tools/build_pwa.mjs --check
      - name: "Unit tests (incl. sync tests: embedded config, example, precache list)"
        run: node --test dev/tests/*.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: QuestionnaireJDR

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
