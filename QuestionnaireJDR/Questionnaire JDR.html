<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire JDR – profils de joueurs</title>
<link rel="stylesheet" href="app/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%238e3b1f'/%3E%3Ccircle cx='10' cy='10' r='2.6' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23fff'/%3E%3Ccircle cx='22' cy='22' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<noscript><p style="padding:24px">Cette application a besoin de JavaScript. Ouvrez ce fichier avec Microsoft Edge, Google Chrome ou Firefox.</p></noscript>

<header class="app-header">
  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="3" y="3" width="34" height="34" rx="8" fill="#8e3b1f" stroke="#b0842f" stroke-width="2"/>
        <circle cx="12.5" cy="12.5" r="3.2" fill="#f6efe3"/><circle cx="27.5" cy="12.5" r="3.2" fill="#f6efe3"/>
        <circle cx="20" cy="20" r="3.2" fill="#f6efe3"/>
        <circle cx="12.5" cy="27.5" r="3.2" fill="#f6efe3"/><circle cx="27.5" cy="27.5" r="3.2" fill="#f6efe3"/>
      </svg>
      <div>
        <h1>Questionnaire JDR</h1>
        <p id="app-subtitle">Profils de joueurs</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="donnees" aria-selected="true">Données</button>
      <button class="tab" role="tab" data-tab="individuels" aria-selected="false">Rapports individuels <span class="count" id="count-resp" hidden></span></button>
      <button class="tab" role="tab" data-tab="global" aria-selected="false">Rapport global</button>
      <button class="tab" role="tab" data-tab="config" aria-selected="false">Configuration <span class="count" id="count-config" hidden></span></button>
      <button class="tab" role="tab" data-tab="aide" aria-selected="false">Aide</button>
    </nav>
  </div>
</header>

<div class="config-banner" id="config-banner"></div>

<main class="app-main">
  <section class="panel active" id="panel-donnees" role="tabpanel" aria-label="Données"></section>
  <section class="panel" id="panel-individuels" role="tabpanel" aria-label="Rapports individuels"></section>
  <section class="panel" id="panel-global" role="tabpanel" aria-label="Rapport global"></section>
  <section class="panel" id="panel-config" role="tabpanel" aria-label="Configuration"></section>
  <section class="panel" id="panel-aide" role="tabpanel" aria-label="Aide"></section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Libraries (vendored, no network needed) -->
<script src="app/vendor/js-yaml.min.js"></script>
<script src="app/vendor/jszip.min.js"></script>
<!-- Application (classic scripts, single global namespace QJ) -->
<script src="app/js/core.js"></script>
<script src="app/js/charts.js"></script>
<script src="app/js/reports.js"></script>
<script src="app/js/config-io.js"></script>
<script src="app/js/xlsx.js"></script>
<script src="app/js/config-par-defaut.js"></script>
<script src="app/js/exemple-donnees.js"></script>
<script src="app/js/util.js"></script>
<script src="app/js/store.js"></script>
<script src="app/js/files.js"></script>
<script src="app/js/ui-donnees.js"></script>
<script src="app/js/ui-individuels.js"></script>
<script src="app/js/ui-global.js"></script>
<script src="app/js/ui-config.js"></script>
<script src="app/js/ui-aide.js"></script>
<script src="app/js/main.js"></script>
</body>
</html>
